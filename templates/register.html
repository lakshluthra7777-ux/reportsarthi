{% extends "base.html" %}

{% block title %}Register - ReportSaathi{% endblock %}

{% block content %}
<div class="card auth-box">
    <div class="feature-icon">🩺</div>
    <h1>Create your account</h1>
    <p class="muted">Keep your family's lab reports in one safe place.</p>
    <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" maxlength="30" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" required
               placeholder="At least 8 characters">

        <button type="submit">Create account</button>
    </form>
    <p class="muted small">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
