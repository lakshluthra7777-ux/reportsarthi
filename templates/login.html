{% extends "base.html" %}

{% block title %}Log in - ReportSaathi{% endblock %}

{% block content %}
<div class="card auth-box">
    <div class="feature-icon">👋</div>
    <h1>Welcome back</h1>
    <p class="muted">Log in to see your family's reports.</p>
    <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Log in</button>
    </form>
    <p class="muted small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
